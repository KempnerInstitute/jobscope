[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscope"
version = "0.1.0"
description = "Slurm job efficiency and GPU utilization reporting from sacct and DCGM/Prometheus"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kempner Institute, Harvard University" },
]
keywords = ["slurm", "hpc", "gpu", "dcgm", "prometheus", "jobstats", "utilization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Clustering",
]
dependencies = [
    "requests>=2.25",
    "plotext>=5.3",
    "rich>=13",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/KempnerInstitute/jobscope"
Repository = "https://github.com/KempnerInstitute/jobscope"

[project.scripts]
jobscope = "jobscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobscope = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
